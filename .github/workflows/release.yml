name: release

# Тег вида 0.1.0 (без v): каталог Obsidian и BRAT ищут релиз, имя которого точно
# равно version из manifest.json. Расхождение здесь означает, что плагин не встанет.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Сборка контракта
        working-directory: shared
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Сборка плагина
        working-directory: plugin
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

      - name: Сверка версии с тегом
        working-directory: plugin
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$manifest" != "${GITHUB_REF_NAME}" ]; then
            echo "версия в manifest.json ($manifest) не совпадает с тегом (${GITHUB_REF_NAME})" >&2
            exit 1
          fi

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Установка через BRAT: Blysspeak/vaultwire. Изменения — в CHANGELOG.md." \
            plugin/main.js plugin/manifest.json plugin/styles.css
